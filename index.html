<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destia - Legal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(180deg, #fdeee3, #f5c9b8, #e69da0, #d17385); min-height: 100vh; color: #4d2e33; }
        .container { max-width: 600px; margin: 0 auto; padding: 80px 24px; text-align: center; }
        h1 { font-family: Georgia, serif; font-size: 42px; margin-bottom: 8px; }
        p.sub { color: #8c6369; margin-bottom: 48px; font-size: 16px; }
        a.card { display: block; background: rgba(255,255,255,0.88); border-radius: 16px; padding: 24px; margin-bottom: 16px; text-decoration: none; color: #4d2e33; font-size: 18px; font-weight: 500; box-shadow: 0 2px 12px rgba(0,0,0,0.06); transition: transform 0.2s; }
        a.card:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Destia</h1>
        <p class="sub">Legal Documents</p>
        <a class="card" href="privacy">Privacy Policy</a>
        <a class="card" href="terms">Terms of Service</a>
    </div>
</body>
</html>
